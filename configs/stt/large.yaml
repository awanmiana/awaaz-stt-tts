# STT configs — Phase 0 (small/medium/large tiers; filled in Phase 2)

stt:
  version: stt-v0.1
  arch: fastconformer
  lang: ur

  d_model: 512
  n_layers: 24
  n_heads: 16

  sample_rate: 16000
  n_mels: 80
  win_ms: 25
  hop_ms: 10
  conv_subsampling: 8x

  loss: ctc+rnn-t
  ctc_weight: 0.8
  rnnt_weight: 0.2

  batch_size: 8
  lr: 0.0003
  max_steps: 8000
  spec_aug: true
  speed_perturb: [0.85, 0.95, 1.0, 1.05, 1.15]

  decoding:
    beam_size: 6
    lm_weight: 0.35
    use_lm: true
    timestamp_tolerance_ms: 200

  vocab_size: 81           # grapheme vocab — shared/vocab.py (STT_VOCAB_SIZE)
