[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "awaaz-stt-tts"
version = "0.1.0"
description = "Urdu-first STT + TTS models built from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "numpy>=1.26
scikit-learn>=1.3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "sentencepiece>=0.2",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["stt*", "tts*", "api*", "shared*", "eval*", "data*"]
